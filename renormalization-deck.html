<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renormalization Theory in Quantum Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0a0f1c;
  --bg-1:#101a2e;
  --bg-2:#152238;
  --panel:rgba(255,255,255,0.045);
  --panel-border:rgba(255,255,255,0.09);
  --ink:#eef3f8;
  --muted:#93a6bd;
  --muted-2:#6c7f97;
  --teal:#5eead4;
  --teal-dim:rgba(94,234,212,0.14);
  --amber:#f4b942;
  --amber-dim:rgba(244,185,66,0.16);
  --danger:#f2735a;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#000;font-family:'Inter',sans-serif;}
.stage{
  width:100%;
  max-width:1280px;
  aspect-ratio:16/9;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(90% 70% at 85% -10%, rgba(94,234,212,0.10) 0%, transparent 55%),
    radial-gradient(70% 60% at 5% 110%, rgba(244,185,66,0.07) 0%, transparent 55%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 55%, #060910 100%);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  font-size:clamp(11px, 1.05vw, 16px);
}
.stage::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(60% 60% at 50% 40%, black 0%, transparent 75%);
  pointer-events:none;
}

/* ---- topbar ---- */
.topbar{
  position:relative; z-index:3;
  display:flex; align-items:center; justify-content:space-between;
  padding: 2.6em 3em 0;
}
.kicker{
  font-family:'JetBrains Mono',monospace;
  font-weight:600;
  font-size:0.78em;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--amber);
  display:flex; align-items:center; gap:.6em;
}
.kicker::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 0 4px var(--amber-dim);
}

.lang-toggle{
  position:relative; z-index:3;
  display:inline-flex; align-items:center;
  padding:3px; border-radius:999px;
  background:var(--panel); border:1px solid var(--panel-border);
  backdrop-filter:blur(6px);
}
.lang-toggle .thumb{
  position:absolute; top:3px; left:3px;
  height:calc(100% - 6px);
  border-radius:999px;
  background:linear-gradient(180deg, #7af0e0, var(--teal));
  transition:transform .3s cubic-bezier(.65,0,.35,1), width .3s cubic-bezier(.65,0,.35,1);
}
.lang-toggle button{
  position:relative; z-index:1; border:none; background:transparent; cursor:pointer;
  padding:.55em 1.2em; font-family:'Inter',sans-serif; font-weight:700;
  font-size:.72em; letter-spacing:.04em; color:var(--muted);
  transition:color .25s ease;
}
.lang-toggle button.active{ color:#04211c; }

/* ---- main content ---- */
.content{
  position:relative; z-index:2;
  flex:1;
  padding: 1.6em 3em 1.2em;
  display:flex; flex-direction:column; justify-content:center;
  gap:1em;
  overflow:hidden;
}
h1.title{
  margin:0; font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:2.15em; line-height:1.12; letter-spacing:-.01em;
  max-width:24ch;
}
.subtitle{ margin:0; color:var(--muted); font-size:1.15em; font-weight:500; max-width:38ch;}
.body-text{ margin:0; color:var(--muted); font-size:1.05em; line-height:1.6; max-width:62ch;}
.bullets{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.55em; max-width:64ch;}
.bullets li{ position:relative; padding-left:1.5em; color:#dbe6ef; font-size:1.02em; line-height:1.5;}
.bullets li::before{ content:"→"; position:absolute; left:0; color:var(--teal); font-weight:700;}
.callout{
  margin-top:.3em;
  border-left:2px solid var(--amber);
  padding:.7em 1em;
  background:var(--amber-dim);
  border-radius:0 10px 10px 0;
  color:#f7e2b4;
  font-size:.96em;
  line-height:1.5;
  max-width:60ch;
}
.formula-block{ display:flex; flex-direction:column; gap:.4em; margin:.2em 0;}
.formula{
  font-family:'JetBrains Mono',monospace;
  font-size:1.15em; color:var(--teal); background:var(--teal-dim);
  border:1px solid rgba(94,234,212,0.25);
  padding:.55em .9em; border-radius:10px; display:inline-block; width:fit-content;
}
.icon-row{ font-size:2.2em; letter-spacing:.3em; }

/* quiz */
.question{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.25em; line-height:1.35; max-width:56ch;}
.options{ display:grid; grid-template-columns:1fr 1fr; gap:.6em; max-width:66ch; margin-top:.3em;}
.option{
  display:flex; align-items:flex-start; gap:.6em;
  padding:.65em .9em; border-radius:10px;
  background:var(--panel); border:1px solid var(--panel-border);
  font-size:.92em; color:#dbe6ef; cursor:pointer;
  transition:background .2s, border-color .2s, transform .15s;
}
.option:hover{ border-color:rgba(94,234,212,0.4); transform:translateY(-1px);}
.option.selected{ background:var(--teal-dim); border-color:var(--teal); color:#eafffb;}
.option.correct{ background:rgba(94,234,212,0.18); border-color:var(--teal); color:#eafffb;}
.option .letter{
  font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--teal);
  flex:0 0 auto;
}
.quiz-note{ margin-top:.2em; font-size:.85em; color:var(--muted-2); }

.answer-banner{
  margin-top:.4em; display:flex; align-items:center; gap:.6em;
  padding:.65em 1em; border-radius:10px;
  background:rgba(94,234,212,0.14); border:1px solid rgba(94,234,212,0.35);
  color:#eafffb; font-size:.95em; font-weight:600; max-width:60ch;
}
.answer-banner .tick{ color:var(--teal); font-size:1.2em; }

/* table */
.tbl-wrap{ overflow:auto; max-width:100%; border-radius:12px; border:1px solid var(--panel-border);}
table.data{ width:100%; border-collapse:collapse; font-size:.86em;}
table.data th, table.data td{
  padding:.55em .8em; text-align:left; border-bottom:1px solid var(--panel-border);
  color:#dbe6ef; vertical-align:top;
}
table.data th{
  font-family:'JetBrains Mono',monospace; font-size:.82em; letter-spacing:.03em;
  text-transform:uppercase; color:var(--teal); background:rgba(94,234,212,0.06);
  font-weight:600;
}
table.data tr:last-child td{ border-bottom:none;}
table.data tbody tr:hover{ background:rgba(255,255,255,0.03);}

/* compare */
.compare{ display:grid; grid-template-columns:1fr 1fr; gap:1.4em; max-width:78ch;}
.compare .col h3{ margin:0 0 .5em; font-family:'Space Grotesk',sans-serif; font-size:1.02em; color:var(--ink);}
.compare .colA h3{ color:var(--muted-2); }
.compare .colB h3{ color:var(--teal); }
.compare .col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5em;}
.compare .col li{ font-size:.9em; line-height:1.45; color:#c9d6e3; padding-left:1.2em; position:relative;}
.compare .colA li::before{ content:"·"; position:absolute; left:0; color:var(--muted-2);}
.compare .colB li::before{ content:"·"; position:absolute; left:0; color:var(--teal);}

/* stat */
.stat-row{ display:flex; gap:1.4em; margin-top:.3em; flex-wrap:wrap;}
.stat-card{
  flex:1; min-width:220px; padding:1em 1.2em; border-radius:12px;
  background:var(--panel); border:1px solid var(--panel-border);
}
.stat-card .label{ font-size:.78em; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-2); font-family:'JetBrains Mono',monospace;}
.stat-card .value{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.5em; margin:.15em 0; color:var(--ink);}
.stat-card .sub{ font-size:.82em; color:var(--muted);}
.stat-arrow{ display:flex; align-items:center; font-size:1.6em; color:var(--teal);}

/* diagram (temple->mandala->tensor) */
.diagram-row{ display:flex; align-items:center; gap:1em; margin:.3em 0 .2em;}
.diagram-step{
  flex:1; text-align:center; padding:1.1em .8em; border-radius:12px;
  background:var(--panel); border:1px solid var(--panel-border);
}
.diagram-step .glyph{ font-size:2em; margin-bottom:.3em; }
.diagram-step .cap{ font-size:.85em; color:var(--muted); font-weight:600;}
.diagram-arrow{ font-size:1.4em; color:var(--teal); flex:0 0 auto;}

/* coarse graining visual */
.coarse-row{ display:flex; align-items:center; gap:1.6em; margin:.4em 0;}
.dotgrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; width:150px;}
.dotgrid span{ width:9px; height:9px; border-radius:50%; background:rgba(94,234,212,0.55);}
.dotgrid.coarse{ grid-template-columns:repeat(2,1fr); width:60px; gap:12px;}
.dotgrid.coarse span{ width:20px; height:20px; background:var(--amber);}
.coarse-arrow{ font-size:1.6em; color:var(--teal);}

/* title slide */
.title-slide{ display:flex; flex-direction:column; justify-content:center; gap:.9em; height:100%;}
.title-slide .kicker{ padding:0; }
.title-slide h1{ font-size:2.5em; max-width:20ch;}
.title-slide .subtitle{ font-size:1.2em; color:var(--teal); font-weight:600;}
.meta-list{ list-style:none; margin:.3em 0 0; padding:0; display:flex; flex-direction:column; gap:.25em;}
.meta-list li{ font-size:.85em; color:var(--muted);}
.tagline{
  margin-top:.6em; font-family:'Space Grotesk',sans-serif; font-style:normal;
  font-size:1.05em; color:#f7e2b4; border-top:1px solid var(--panel-border); padding-top:.7em;
  max-width:44ch;
}

/* closing slide */
.closing-slide{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; height:100%; gap:.4em;}
.closing-slide h1{ font-size:3em;}
.closing-slide .subtitle{ font-size:1.3em;}

/* quote slide */
.quote-slide{ display:flex; flex-direction:column; justify-content:center; height:100%; gap:.8em;}
.quote-slide .body-text{ font-size:1.18em; color:#dbe6ef; max-width:64ch; line-height:1.6;}

/* footer / nav */
.footer{
  position:relative; z-index:3;
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 3em 1.6em;
}
.progress-wrap{ flex:1; margin:0 1.6em; height:3px; background:var(--panel-border); border-radius:3px; overflow:hidden;}
.progress-bar{ height:100%; background:linear-gradient(90deg,var(--teal),var(--amber)); transition:width .3s ease;}
.nav-btn{
  width:2.2em; height:2.2em; border-radius:50%; border:1px solid var(--panel-border);
  background:var(--panel); color:var(--ink); font-size:1em; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, border-color .2s;
}
.nav-btn:hover{ border-color:var(--teal); color:var(--teal);}
.nav-btn:disabled{ opacity:.3; cursor:default;}
.counter{ font-family:'JetBrains Mono',monospace; font-size:.78em; color:var(--muted-2); white-space:nowrap;}
.nav-group{ display:flex; align-items:center; gap:.5em;}

@media (max-width:700px){
  .options{ grid-template-columns:1fr; }
  .compare{ grid-template-columns:1fr; }
  h1.title{ font-size:1.5em; }
  .stage{ font-size: 10px; }
}
</style>
</head>

<div class="stage" id="stage" lang="en">
  <div class="topbar">
    <div class="kicker" id="kicker"></div>
    <div class="lang-toggle" id="langToggle">
      <div class="thumb" id="thumb"></div>
      <button type="button" class="active" data-lang="en">ENGLISH</button>
      <button type="button" data-lang="es">ESPAÑOL</button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="footer">
    <div class="nav-group">
      <button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button>
      <span class="counter" id="counter">1 / 60</span>
      <button class="nav-btn" id="nextBtn" aria-label="Next">›</button>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <span class="counter" id="hint">← → to navigate</span>
  </div>
</div>

<script>
const SLIDES = JSON.parse(document.getElementById('slides-data').textContent);
let idx = 0;
let lang = 'en';
const quizState = {}; // slideIndex -> selected option index

const stage = document.getElementById('stage');
const contentEl = document.getElementById('content');
const kickerEl = document.getElementById('kicker');
const counterEl = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const LETTERS = ['A','B','C','D','E','F'];

function esc(str){
  if(str===undefined || str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBullets(arr){
  if(!arr || !arr.length) return '';
  return `<ul class="bullets">${arr.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;
}
function renderFormula(arr){
  if(!arr || !arr.length) return '';
  return `<div class="formula-block">${arr.map(f=>`<span class="formula">${esc(f)}</span>`).join('')}</div>`;
}
function renderCallout(text){
  if(!text) return '';
  return `<div class="callout">${esc(text)}</div>`;
}
function renderBody(arr_or_str){
  if(!arr_or_str) return '';
  if(Array.isArray(arr_or_str)) return arr_or_str.map(p=>`<p class="body-text">${esc(p)}</p>`).join('');
  return `<p class="body-text">${esc(arr_or_str)}</p>`;
}

function renderTable(headers, rows){
  const thead = `<thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  return `<div class="tbl-wrap"><table class="data">${thead}${tbody}</table></div>`;
}

function renderOptions(options, slideIdx, opts){
  opts = opts || {};
  const selected = quizState[slideIdx];
  return `<div class="options">${options.map((o,i)=>{
    let cls = 'option';
    if(opts.answerIndex !== undefined){
      if(i === opts.answerIndex) cls += ' correct';
    } else if(selected === i){
      cls += ' selected';
    }
    return `<div class="${cls}" data-i="${i}" onclick="selectOption(${slideIdx},${i})"><span class="letter">${LETTERS[i]}</span><span>${esc(o)}</span></div>`;
  }).join('')}</div>`;
}

function selectOption(slideIdx, i){
  const slide = SLIDES[slideIdx];
  if(slide.type === 'reveal_quiz') return; // already revealed, no selection needed
  quizState[slideIdx] = i;
  render();
}

function renderSlide(){
  const slide = SLIDES[idx];
  const d = slide[lang];
  kickerEl.textContent = d.kicker || '';
  kickerEl.style.visibility = d.kicker ? 'visible' : 'hidden';

  let html = '';

  switch(slide.type){
    case 'title':
      html = `<div class="title-slide">
        <h1 class="title">${esc(d.title)}</h1>
        <p class="subtitle">${esc(d.subtitle)}</p>
        <ul class="meta-list">${(d.meta||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ul>
        <p class="tagline">${esc(d.tagline)}</p>
      </div>`;
      break;

    case 'closing':
      html = `<div class="closing-slide">
        <h1 class="title">${esc(d.title)}</h1>
        <p class="subtitle">${esc(d.subtitle)}</p>
      </div>`;
      break;

    case 'quote':
      html = `<div class="quote-slide">
        <h1 class="title">${esc(d.title)}</h1>
        ${renderBody(d.body)}
      </div>`;
      break;

    case 'text':
      html = `<h1 class="title">${esc(d.title)}</h1>
        ${d.icon ? `<div class="icon-row">${d.icon}</div>` : ''}
        ${renderFormula(d.formula)}
        ${renderBody(d.body)}
        ${renderBullets(d.bullets)}
        ${renderCallout(d.callout)}`;
      break;

    case 'quiz':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        ${renderFormula(d.formula)}
        <p class="question">${esc(d.question)}</p>
        ${renderOptions(d.options, idx, {})}
        ${d.note ? `<div class="quiz-note">${esc(d.note)}</div>` : ''}`;
      break;

    case 'reveal_quiz':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        <p class="question">${esc(d.question)}</p>
        ${renderOptions(d.options, idx, {answerIndex:d.answer_index})}
        <div class="answer-banner"><span class="tick">✓</span>${esc(d.answer_text)}</div>`;
      break;

    case 'reveal':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        ${renderFormula(d.formula)}
        ${renderBody(d.body)}`;
      break;

    case 'table':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        ${renderBullets(d.bullets)}
        ${renderTable(d.headers, d.rows)}
        ${d.note ? `<p class="body-text" style="font-size:.85em">${esc(d.note)}</p>` : ''}`;
      break;

    case 'compare':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        <div class="compare">
          <div class="col colA"><h3>${esc(d.colA_title)}</h3><ul>${d.colA.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
          <div class="col colB"><h3>${esc(d.colB_title)}</h3><ul>${d.colB.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        </div>`;
      break;

    case 'stat':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        ${renderBody(d.body)}
        <div class="stat-row">
          ${d.stats.map((s,i)=>`${i>0?'<div class="stat-arrow">→</div>':''}<div class="stat-card"><div class="label">${esc(s.label)}</div><div class="value">${esc(s.value)}</div><div class="sub">${esc(s.sub)}</div></div>`).join('')}
        </div>`;
      break;

    case 'diagram':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        <div class="diagram-row">
          ${d.steps.map((s,i)=>`${i>0?'<div class="diagram-arrow">→</div>':''}<div class="diagram-step"><div class="glyph">${['🛕','🕸️','🔗'][i]||'◆'}</div><div class="cap">${esc(s)}</div></div>`).join('')}
        </div>
        ${renderBody(d.body)}
        ${renderCallout(d.callout)}`;
      break;

    case 'coarse':
      html = `<h1 class="title" style="font-size:1.5em">${esc(d.title)}</h1>
        <div class="coarse-row">
          <div class="dotgrid">${Array(24).fill('<span></span>').join('')}</div>
          <div class="coarse-arrow">→</div>
          <div class="dotgrid coarse">${Array(4).fill('<span></span>').join('')}</div>
        </div>
        ${renderBody(d.body)}`;
      break;
  }

  contentEl.innerHTML = html;
  counterEl.textContent = `${idx+1} / ${SLIDES.length}`;
  progressBar.style.width = `${((idx+1)/SLIDES.length)*100}%`;
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===SLIDES.length-1;
  stage.setAttribute('lang', lang);
}

function render(){ renderSlide(); }

function goTo(i){
  idx = Math.max(0, Math.min(SLIDES.length-1, i));
  render();
}

prevBtn.addEventListener('click', ()=>goTo(idx-1));
nextBtn.addEventListener('click', ()=>goTo(idx+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') { e.preventDefault(); goTo(idx+1); }
  if(e.key==='ArrowLeft') { e.preventDefault(); goTo(idx-1); }
});

// language toggle
const toggle = document.getElementById('langToggle');
const thumb = document.getElementById('thumb');
const langButtons = toggle.querySelectorAll('button');

function positionThumb(btn){
  thumb.style.width = btn.offsetWidth + 'px';
  thumb.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
}
function setLang(l){
  lang = l;
  langButtons.forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  positionThumb(toggle.querySelector(`button[data-lang="${l}"]`));
  render();
}
langButtons.forEach(b=>b.addEventListener('click', ()=>setLang(b.dataset.lang)));

window.addEventListener('load', ()=>{ positionThumb(toggle.querySelector('button.active')); renderSlide(); });
window.addEventListener('resize', ()=>{ positionThumb(toggle.querySelector('button.active')); });
</script>
