<script>
function buildCircuitSVG(doc, spec, opts = {}) {
  const colWidth = opts.colWidth || 70;
  const rowHeight = opts.rowHeight || 50;
  const marginL = opts.marginL || 50;
  const marginT = opts.marginT || 25;
  const width = marginL + spec.cols * colWidth + 30;
  const height = marginT * 2 + (spec.numQubits - 1) * rowHeight + 30;

  const svg = doc.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('width', '100%');

  function qy(q) { return marginT + q * rowHeight; }
  function cx(col) { return marginL + col * colWidth + colWidth/2; }

  for (let q = 0; q < spec.numQubits; q++) {
    const line = doc.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', marginL - 20); line.setAttribute('x2', width - 15);
    line.setAttribute('y1', qy(q)); line.setAttribute('y2', qy(q));
    line.setAttribute('class', 'wire');
    svg.appendChild(line);

    const label = doc.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', marginL - 30); label.setAttribute('y', qy(q) + 4);
    label.setAttribute('class', 'qlabel'); label.setAttribute('text-anchor', 'end');
    label.textContent = spec.wireLabels ? spec.wireLabels[q] : `q${q}`;
    svg.appendChild(label);
  }

  for (const g of spec.gates) {
    if (g.type === 'box') {
      const bx = cx(g.col) - 24, by = qy(g.qubit) - 16;
      const rect = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', bx); rect.setAttribute('y', by);
      rect.setAttribute('width', 48); rect.setAttribute('height', 32);
      rect.setAttribute('rx', 6); rect.setAttribute('class', 'gateBox');
      svg.appendChild(rect);
      const text = doc.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', cx(g.col)); text.setAttribute('y', qy(g.qubit) + 5);
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('class', 'gateLabel');
      text.textContent = g.label;
      svg.appendChild(text);
    } else if (g.type === 'cnot') {
      const x = cx(g.col);
      const line = doc.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x); line.setAttribute('x2', x);
      line.setAttribute('y1', qy(g.control)); line.setAttribute('y2', qy(g.target));
      line.setAttribute('class', 'cnotLine');
      svg.appendChild(line);

      const dot = doc.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', qy(g.control));
      dot.setAttribute('r', 6); dot.setAttribute('class', 'controlDot');
      svg.appendChild(dot);

      const targ = doc.createElementNS('http://www.w3.org/2000/svg', 'circle');
      targ.setAttribute('cx', x); targ.setAttribute('cy', qy(g.target));
      targ.setAttribute('r', 12); targ.setAttribute('class', 'targetCircle');
      svg.appendChild(targ);
      const plus = doc.createElementNS('http://www.w3.org/2000/svg', 'text');
      plus.setAttribute('x', x); plus.setAttribute('y', qy(g.target)+5);
      plus.setAttribute('text-anchor','middle'); plus.setAttribute('class','targetPlus');
      plus.textContent = '+';
      svg.appendChild(plus);
    } else if (g.type === 'meter') {
      const x = cx(g.col), y = qy(g.qubit);
      const rect = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x-20); rect.setAttribute('y', y-16);
      rect.setAttribute('width', 40); rect.setAttribute('height', 32);
      rect.setAttribute('rx', 6); rect.setAttribute('class', 'meterBox');
      svg.appendChild(rect);
      const arc = doc.createElementNS('http://www.w3.org/2000/svg', 'path');
      arc.setAttribute('d', `M ${x-10} ${y+6} A 10 10 0 0 1 ${x+10} ${y+6}`);
      arc.setAttribute('class', 'meterArc');
      svg.appendChild(arc);
    }
  }
  return svg;
}
</script>

let lang = 'es';

function t(key) { return I18N[lang][key]; }

function setLang(l) {
  lang = l;
  document.getElementById('btnEs').classList.toggle('active', l === 'es');
  document.getElementById('btnEn').classList.toggle('active', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  renderProblems();
}

function renderProblems() {
  const container = document.getElementById('problems');
  container.innerHTML = '';
  PROBLEMS.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'problem';
    div.innerHTML = `
      <div class="pHeader">
        <div class="pNum">${String(idx+1).padStart(2,'0')}</div>
        <div class="pTitleBlock">
          <div class="pTitle">${p.title[lang]}</div>
          <span class="pTag">${p.tag}</span>
        </div>
      </div>
      <div class="circuitBox" id="circuit-${idx}"></div>
      <div class="toggleRow">
        <button class="revealBtn advToggle" data-idx="${idx}">${t('advBtn')}</button>
        <button class="revealBtn simpleToggle" data-idx="${idx}">${t('simpleBtn')}</button>
      </div>
      <div class="panelContent advanced" id="adv-${idx}">
        <span class="panelLabel">${t('advLabel')}</span>
        <p class="qText">${p.adv[lang]}</p>
        <p>${p.advAnswer[lang]}</p>
      </div>
      <div class="panelContent simple" id="simple-${idx}">
        <span class="panelLabel">${t('simpleLabel')}</span>
        <p>${p.simple[lang]}</p>
      </div>
    `;
    container.appendChild(div);
    const svg = buildCircuitSVG(document, p.circuit);
    document.getElementById(`circuit-${idx}`).appendChild(svg);
  });

  document.querySelectorAll('.advToggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = btn.getAttribute('data-idx');
      const panel = document.getElementById(`adv-${i}`);
      panel.classList.toggle('show');
      btn.classList.toggle('active');
    });
  });
  document.querySelectorAll('.simpleToggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = btn.getAttribute('data-idx');
      const panel = document.getElementById(`simple-${i}`);
      panel.classList.toggle('show');
      btn.classList.toggle('active');
    });
  });
}

document.getElementById('btnEs').addEventListener('click', () => setLang('es'));
document.getElementById('btnEn').addEventListener('click', () => setLang('en'));
setLang('es');
</script>
